<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">PCTestAdmin — Developer Profile</title>
<desc id="desc">Dark blue developer banner with a minimal terminal-inspired design.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B101C"/><stop offset=".58" stop-color="#101B32"/><stop offset="1" stop-color="#09111F"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58A6FF"/><stop offset="1" stop-color="#B392FF"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#377CFB" stop-opacity=".32"/><stop offset="1" stop-color="#377CFB" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7A9AC0" stroke-width=".6" opacity=".25"/></pattern>
</defs>
<rect width="1200" height="300" rx="22" fill="url(#bg)"/>
<rect width="1200" height="300" rx="22" fill="url(#grid)"/>
<circle cx="1020" cy="145" r="265" fill="url(#glow)"/>
<path d="M 0 280 H 1200" stroke="url(#accent)" stroke-width="3" opacity=".85"/>
<path d="M 830 55 H 1052 L 1100 103 V 211 H 916 L 868 163 V 111" fill="none" stroke="#5D93CF" stroke-width="2" opacity=".25"/>
<path d="M 900 82 H 1052 M 920 119 H 1090 M 947 155 H 1064 M 920 191 H 1036" fill="none" stroke="#86A9DD" stroke-width="2" stroke-linecap="round" opacity=".22"/>
<circle cx="1100" cy="103" r="7" fill="#58A6FF"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></circle>
<rect x="65" y="57" width="9" height="9" rx="4.5" fill="#58A6FF"/>
<text x="88" y="67" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="#8CB8E8">DEVELOPER PROFILE</text>
<text x="65" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="65" font-weight="700" letter-spacing="-2" fill="#F0F6FC">PCTestAdmin</text>
<rect x="65" y="173" width="150" height="4" rx="2" fill="url(#accent)"/>
<text x="65" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#B7C9E0">Software Engineering  ·  Open Source  ·  Developer Tools</text>
<rect x="1060" y="46" width="91" height="30" rx="15" fill="#142942" stroke="#30527B"/>
<circle cx="1080" cy="61" r="4" fill="#46D69B"/>
<text x="1093" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#BDD6F2">BUILD</text>
</svg>